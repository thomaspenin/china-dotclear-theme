<!-- Set the viewport so this responsive site displays correctly on mobile devices -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Base font -->
<link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'>
<!-- Font for pinyin -->
<link href='https://fonts.googleapis.com/css?family=Ubuntu' rel='stylesheet' type='text/css'>
<!-- Cursive font for the tagline -->
<link href='https://fonts.googleapis.com/css?family=Damion' rel='stylesheet' type='text/css'>
<!-- Bootstrap CSS -->
<link href="{{tpl:BlogThemeURL}}/includes/bootstrap-3.3.2-dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Theme CSS -->
<link href="{{tpl:BlogThemeURL}}/includes/css/style.css" rel="stylesheet">
<!-- Javascript, jQuery must come FIRST for Boostrap plugins to work -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
<!-- Bootstrap JS plugins -->
<script src="{{tpl:BlogThemeURL}}/includes/bootstrap-3.3.2-dist/js/bootstrap.min.js"></script>
<!-- Script to resize Chinese text -->
<script type="text/javascript" src="{{tpl:BlogThemeURL}}/includes/js/jquery.ba-replacetext.js"></script>
<!-- Load pinyin definitions -->
<script type="text/javascript" src="{{tpl:BlogThemeURL}}/includes/js/jquery.pinyin.js"></script>
<!-- Cookie management for the "remember me" functionality -->
<script type="text/javascript" src="{{tpl:BlogThemeURL}}/includes/js/jquery.cookie.js"></script>
<!-- Load script to prepare the media players -->
<script type="text/javascript" src="{{tpl:BlogThemeURL}}/includes/js/jquery.player.js"></script>
<!-- Load script to prepare the exercices -->
<script type="text/javascript" src="{{tpl:BlogThemeURL}}/includes/js/jquery.exercices.js"></script>
<!-- Load script to create pinyin tooltips when hovering "ch" or "chb" tags -->
<script type="text/javascript" src="{{tpl:BlogThemeURL}}/includes/js/jquery.chinese.js"></script>
<!-- Load script to lazy load images -->
<script type="text/javascript" src="{{tpl:BlogThemeURL}}/includes/js/img-lazy-loading.js"></script>

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{tpl:BlogThemeURL}}/includes/images/logo/orchid-64.png" />

<!-- Javascript to execute once the document is ready -->
<script type="text/javascript">
  $(document).ready(function()
  {
    // Prepare the pinyin that should appear when hovering <ch> or <chb> tags
    preparePinyinOnHover();

    // Transform all the pinyin that is of the form ni3hao3 in "py" and "pyb" markup to accented pinyin
    transformPinyin();

    // Initialize tooltips
    $('[data-toggle="tooltip"]').tooltip({
      delay: { "show": 1000, "hide": 0 }
    });

    // Transform Chinese in the content but avoid some cases
    $("body *").find(':not(pre):not(code):not(char):not(.blogTitle)').replaceText(/([\u3000-\uFFFF]+)/g,"<span class='zh'>$1</span>");

    // Code for the button allowing the user to go back to top
    var pxShow      = 10; //height on which the button will show
    var fadeInTime  = 1000; //how slow/fast you want the button to show
    var fadeOutTime = 1000; //how slow/fast you want the button to hide
    var scrollSpeed = 0; //how slow/fast you want the button to scroll to top. can be a value, 'slow', 'normal' or 'fast'
    jQuery(window).scroll(function() {
      if(jQuery(window).scrollTop() >= pxShow) {
	jQuery("#back-to-top").fadeIn(fadeInTime);
      } else {
	jQuery("#back-to-top").fadeOut(fadeOutTime);
      }
    });
    jQuery('#back-to-top a').click(function() {
      jQuery('html, body').animate({scrollTop:0}, scrollSpeed);
      return false;
    });

    // Prepare the audio players
    prepareAudioPlayers();

    // Configure excercices
    configureExercices();

    // Lazy-load the images
    var placeholders = document.querySelectorAll('.defer-image');
    for (var i = 0, len = placeholders.length; i < len; i++) {
        deferImage(placeholders[i]);
    }
  })
</script>
