<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="{{tpl:BlogLanguage}}" lang="{{tpl:BlogLanguage}}">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="MSSmartTagsPreventParsing" content="TRUE" />
<meta name="ROBOTS" content="{{tpl:BlogMetaRobots}}" />
<title>{{tpl:lang All articles}} - {{tpl:BlogName encode_html="1"}}</title>
<meta name="copyright" content="{{tpl:BlogCopyrightNotice encode_html="1"}}" />
<meta name="author" content="{{tpl:BlogEditor encode_html="1"}}" />
<meta name="date" scheme="W3CDTF" content="{{tpl:BlogUpdateDate iso8601="1"}}" />
<link rel="schema.dc" href="http://purl.org/dc/elements/1.1/" />
<meta name="dc.title" lang="{{tpl:BlogLanguage}}" content="{{tpl:lang Archives}} - {{tpl:BlogName encode_html="1"}}" />
<meta name="dc.language" content="{{tpl:BlogLanguage}}" />
<meta name="dc.publisher" content="{{tpl:BlogEditor encode_html="1"}}" />
<meta name="dc.rights" content="{{tpl:BlogCopyrightNotice encode_html="1"}}" />
<meta name="dc.date" scheme="W3CDTF" content="{{tpl:BlogUpdateDate iso8601="1"}}" />
<meta name="dc.type" content="text" />
<meta name="dc.format" content="text/html" />
<link rel="top" href="{{tpl:BlogURL}}" title="{{tpl:lang Home}}" />

<tpl:Archives>
<link rel="chapter" href="{{tpl:ArchiveURL}}" title="{{tpl:ArchiveDate encode_html="1"}}" />
</tpl:Archives>
<link rel="alternate" type="application/atom+xml" title="Atom 1.0" href="{{tpl:BlogFeedURL type="atom"}}" />

{{tpl:include src="_head.html"}}
</head>

<body>
  <div id="page" class="container">
    <!-- Top bar present on all pages -->
    {{tpl:include src="_top.html"}}

    <!-- Header of the post -->
    <div id="post-header">
      <h1 class="post-title"><a href="">{{tpl:lang All articles}}</a></h1>
    </div>

    <div class="middle">

      <div class="content-info">
	<p>{{tpl:lang To display articles along their summary, choose a particular period:}}</p>
	<div class="period-picker">
	  <div class="previous-period"></div>
	  <div class="choice-period">
	    <tpl:Archives>
	      <tpl:ArchivesHeader>
	      
	      <form method="get" action="{{tpl:BlogArchiveURL}}" id="archives">
		<select name="archives" onchange="location = this.options[this.selectedIndex].value;">
		  <option selected disabled>{{tpl:lang Date range choice}}</option>
		  <option value="{{tpl:BlogArchiveURL}}">{{tpl:lang No restriction (titles only)}}</option>
		</tpl:ArchivesHeader>
		<tpl:ArchivesYearHeader><optgroup label="{{tpl:ArchiveDate format="%Y"}}"></tpl:ArchivesYearHeader>
		  <option value="{{tpl:ArchiveURL}}">
			{{tpl:ArchiveDate encode_html="1" format="%B"}} ({{tpl:ArchiveEntriesCount}})
		  </option>
		<tpl:ArchivesYearFooter></optgroup></tpl:ArchivesYearFooter>
		<tpl:ArchivesFooter>
		</select>
	      </form>
	      </tpl:ArchivesFooter>
	    </tpl:Archives>
	  </div>
	  <div class="next-period"></div>
	</div>
      </div>

      <div class="post-list">
      <tpl:Archives>
	<!--<tpl:Entries>
	  <div class="post-list-item">
	    <h3><a href="{{tpl:EntryURL}}">{{tpl:EntryTitle}}</a></h3>-->

	    <!-- # --BEHAVIOR-- publicEntryBeforeContent -->
	    <!--{{tpl:SysBehavior behavior="publicEntryBeforeContent"}}

	    <div >-->
	      <!-- Show the excerpt if any -->
	      <!--<tpl:EntryIf extended="1">
		  {{tpl:EntryExcerpt}}
		  <a class="read-more" title="{{tpl:lang Read the post}}" href="{{tpl:EntryURL}}">{{tpl:lang More}} »</a>
	      </tpl:EntryIf>-->

	      <!-- If there is no excerpt, show the post content -->
	      <!--<tpl:EntryIf extended="0">
		  {{tpl:EntryContent}}
	      </tpl:EntryIf>
	    </div>
	    <span class="post-author">
	      <p>{{tpl:lang By}} <b>{{tpl:EntryAuthorLink}}</b>, {{tpl:EntryDate format="le %d %B %Y"}}</p>
	    </span>
	    <div class="comment-count">
	      <a href="{{tpl:EntryURL}}#comments" title="{{tpl:EntryCommentCount}}">{{tpl:EntryCommentCount none="0" one="1" more="%s"}}</a>
	    </div>-->

	    <!-- # --BEHAVIOR-- publicEntryAfterContent -->
	    <!--{{tpl:SysBehavior behavior="publicEntryAfterContent"}}-->

	  <!--</div>
	
	  <tpl:EntriesFooter>
	    <hr class="clear" />
	    <tpl:Pagination>
	      <p class="pagination content-info">{{tpl:PaginationLinks max="5"}}</p>
	    </tpl:Pagination>
	  </tpl:EntriesFooter>
	</tpl:Entries>-->


	<tpl:ArchivesHeader>
	  <hr class="clear" />
	</tpl:ArchivesHeader>
	<tpl:Entries>
	  <tpl:EntriesHeader>
	    <p><strong>{{tpl:ArchiveDate upper_case="1"}}</strong></p>
	    <ul>
	  </tpl:EntriesHeader>
	  <li><a href="{{tpl:EntryURL}}">{{tpl:EntryTitle}}</a></li>
	  <tpl:EntriesFooter>
	    </ul>
	  </tpl:EntriesFooter>
	</tpl:Entries>

      </tpl:Archives>
      </div>
    </div>

    <!-- Footer (present on all pages) -->
    {{tpl:include src="_footer.html"}}
  </div> <!-- End #page -->
</body>
</html>
