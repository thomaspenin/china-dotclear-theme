<!-- Site header and navigation -->
<header id="top" role="header">
  <div class="fixed-top top-background">
    <div class="container navbar-expand-md">
      <a
        href="{{tpl:BlogURL}}"
        data-bs-toggle="tooltip"
        data-placement="bottom"
        title="{{tpl:lang Home page}}"
        class="navbar-brand float-start"
      >
        <span class="blogTitle">{{tpl:BlogName}}</span
        ><span class="blogTagLine d-none d-md-inline">
          {{tpl:BlogDescription remove_html="1"}}</span
        >
      </a>
      <button
        class="navbar-toggler"
        data-bs-toggle="collapse"
        data-bs-target=".navbar-collapse"
      >
        <i class="ph ph-list"></i>
      </button>
      <button
        class="navbar-toggler"
        onclick="window.scrollTo({ top: 0, behavior: 'auto' })"
        data-bs-toggle="tooltip"
        data-placement="bottom"
        title="{{tpl:lang Back to the top of the page}}"
      >
        <i class="ph ph-caret-up"></i>
      </button>
      <div class="small-screen-menu">
        <nav class="navbar-collapse collapse" role="navigation">
          <ul class="navbar-nav nav">
            <li>
              <a
                href="{{tpl:BlogArchiveURL}}"
                data-bs-toggle="tooltip"
                data-placement="bottom"
                title="{{tpl:lang Browse the list of articles published on the site}}"
                ><i class="ph ph-note-pencil"></i
                ><span class="d-inline d-sm-none d-lg-inline"
                  >&nbsp;&nbsp;&nbsp;{{tpl:lang Articles}}</span
                ></a
              >
            </li>
            <li>
              <a
                href="{{tpl:BlogURL}}categories"
                data-bs-toggle="tooltip"
                data-placement="bottom"
                title="{{tpl:lang Browse the different categories}}"
                ><i class="ph ph-globe-hemisphere-east"></i
                ><span class="d-inline d-sm-none d-lg-inline"
                  >&nbsp;&nbsp;&nbsp;{{tpl:lang Categories}}</span
                ></a
              >
            </li>
            <li>
              <a
                href="{{tpl:BlogURL}}tags"
                data-bs-toggle="tooltip"
                data-placement="bottom"
                title="{{tpl:lang Search for articles using keywords}}"
                ><i class="ph ph-tag"></i
                ><span class="d-inline d-sm-none d-lg-inline"
                  >&nbsp;&nbsp;&nbsp;{{tpl:lang Tags}}</span
                ></a
              >
            </li>
            <li>
              <a
                href="{{tpl:BlogURL}}pages/about"
                data-bs-toggle="tooltip"
                data-placement="bottom"
                title="{{tpl:lang Know more about the site and its author}}"
                ><i class="ph ph-user"></i
                ><span class="d-inline d-sm-none d-lg-inline"
                  >&nbsp;&nbsp;&nbsp;{{tpl:lang About}}</span
                ></a
              >
            </li>
          </ul>
          <form
            class="top-search-form ms-auto"
            role="search"
            method="get"
            action="{{tpl:BlogURL}}"
            id="searchField"
          >
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                placeholder="{{tpl:lang Search (verb)}}"
                name="q"
              />
              <button
                class="btn btn-secondary"
                type="button"
                onclick="document.getElementById('searchField').submit()"
              >
                <i class="ph ph-magnifying-glass"></i>
              </button>
            </div>
          </form>
        </nav>
      </div>
    </div>
  </div>
</header>

{{tpl:include src="_back-to-top.html"}}
