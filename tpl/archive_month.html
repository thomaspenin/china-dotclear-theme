<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="{{tpl:BlogLanguage}}" lang="{{tpl:BlogLanguage}}">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="MSSmartTagsPreventParsing" content="TRUE" />
<meta name="ROBOTS" content="{{tpl:BlogMetaRobots robots="NOINDEX"}}" />
<title>{{tpl:lang Articles}} - {{tpl:ArchiveDate}} - {{tpl:BlogName encode_html="1"}}</title>
<meta name="copyright" content="{{tpl:BlogCopyrightNotice encode_html="1"}}" />
<meta name="author" content="{{tpl:BlogEditor encode_html="1"}}" />
<meta name="date" scheme="W3CDTF" content="{{tpl:BlogUpdateDate iso8601="1"}}" />
<link rel="schema.dc" href="http://purl.org/dc/elements/1.1/" />
<meta name="dc.title" lang="{{tpl:BlogLanguage}}" content="{{tpl:lang Archives}} - {{tpl:ArchiveDate}} - {{tpl:BlogName encode_html="1"}}" />
<meta name="dc.language" content="{{tpl:BlogLanguage}}" />
<meta name="dc.publisher" content="{{tpl:BlogEditor encode_html="1"}}" />
<meta name="dc.rights" content="{{tpl:BlogCopyrightNotice encode_html="1"}}" />
<meta name="dc.date" scheme="W3CDTF" content="{{tpl:BlogUpdateDate iso8601="1"}}" />
<meta name="dc.type" content="text" />
<meta name="dc.format" content="text/html" />
<link rel="top" href="{{tpl:BlogURL}}" title="{{tpl:lang Home}}" />
<link rel="up" href="{{tpl:BlogArchiveURL}}" title="{{tpl:lang Archives}}" />
<link rel="contents" href="{{tpl:BlogArchiveURL}}" title="{{tpl:lang Archives}}" />
<tpl:ArchiveNext><link rel="next" href="{{tpl:ArchiveURL}}" title="{{tpl:ArchiveDate encode_html="1"}}" /></tpl:ArchiveNext>
<tpl:ArchivePrevious><link rel="previous" href="{{tpl:ArchiveURL}}" title="{{tpl:ArchiveDate encode_html="1"}}" /></tpl:ArchivePrevious>
<tpl:Entries no_content="1">
<link rel="chapter" href="{{tpl:EntryURL}}" title="{{tpl:EntryTitle encode_html="1"}}" />
</tpl:Entries>
  
{{tpl:include src="_head.html"}}
</head>

<body>
  <div id="page" class="container-fluid">
    <!-- Top bar present on all pages -->
    {{tpl:include src="_top.html"}}

    <!-- Title -->
	<div class="page-title-background">
		<div class="page-title">
		<h1><a href="{{tpl:ArchiveURL}}">{{tpl:lang Articles publiés en}} {{tpl:ArchiveDate format="%B %Y"}}</a></h1>
		</div>
	</div>

    <div class="archives middle">

	<div class="date-range-picker-background">
      <div class="date-range-picker">
	<div class="period-picker container">
		<div class="row">
	  <div class="previous-period col-sm-4">
	    <tpl:ArchivePrevious><a href="{{tpl:ArchiveURL}}" class="prev"><i class="ph ph-caret-left"></i>&nbsp;<span class="archive-navigation-date">{{tpl:ArchiveDate encode_html="1"}}</span></a></tpl:ArchivePrevious>
	  </div>
	  <div class="choice-period col-sm-4">
	    <tpl:Archives>
	      <tpl:ArchivesHeader>
		<form method="get" action="{{tpl:BlogArchiveURL}}" id="archives">
		  <select class="form-select" name="archives" onchange="location = this.options[this.selectedIndex].value;">
		    <option selected disabled>{{tpl:lang Date range choice}}</option>
		    <option value="{{tpl:BlogArchiveURL}}">{{tpl:lang No restriction (all articles)}}</option>
		  </tpl:ArchivesHeader>
		  <tpl:ArchivesYearHeader><optgroup label="{{tpl:ArchiveDate format="%Y"}}"></tpl:ArchivesYearHeader>
		    <option class="archive-month-option" value="{{tpl:ArchiveURL}}">
		      {{tpl:ArchiveDate encode_html="1" format="%B" lower_case="1"}} ({{tpl:ArchiveEntriesCount}})
		    </option>
		  <tpl:ArchivesYearFooter></optgroup></tpl:ArchivesYearFooter>
		  <tpl:ArchivesFooter>
		  </select>
		</form>
	      </tpl:ArchivesFooter>
	    </tpl:Archives>
	  </div>
	  <div class="next-period col-sm-4">
	    <tpl:ArchiveNext><a href="{{tpl:ArchiveURL}}" class="next"><span class="archive-navigation-date">{{tpl:ArchiveDate encode_html="1"}}</span>&nbsp;<i class="ph ph-caret-right"></i></a></tpl:ArchiveNext>
	  </div>
	</div>
	</div>
      </div>
	</div>

      <!-- Include the list of the posts that were published in this time frame -->
      <div class="container">
	  {{tpl:include src="_posts-list.html"}}
      </div>
    
    </div>

    <!-- Footer (present on all pages) -->
    {{tpl:include src="_footer.html"}}
  </div> <!-- End #page -->
</body>
</html>
