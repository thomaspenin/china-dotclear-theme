<!-- Set the viewport so this responsive site displays correctly on mobile devices -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Web fonts -->
<link
  href="https://fonts.googleapis.com/css?family=Muli:300,500|Inconsolata:700|Ubuntu:300"
  rel="stylesheet"
/>
<!-- Cursive font for the tagline -->
<link
  href="https://fonts.googleapis.com/css?family=Damion"
  rel="stylesheet"
  type="text/css"
/>
<!-- Phosphor Icons -->
<link
  rel="stylesheet"
  type="text/css"
  href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
/>
<!-- Bootstrap CSS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha256-oxqX0LQclbvrsJt8IymkxnISn4Np2Wy2rY9jjoQlDEg="
  crossorigin="anonymous"
/>
<!-- Theme CSS -->
<link href="{{tpl:BlogThemeURL}}/includes/css/style.css" rel="stylesheet" />
<!-- Javascript, jQuery must come FIRST for our custom jQuery plugins to work -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- Bootstrap JS bundle (includes Popper) -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
  integrity="sha256-y3ibfOyBqlgBd+GzwFYQEVOZdNJD06HeDXihongBXKs="
  crossorigin="anonymous"
></script>
<!-- Script to resize Chinese text -->
<script
  type="text/javascript"
  src="{{tpl:BlogThemeURL}}/includes/js/jquery.ba-replacetext.js"
></script>
<!-- Load pinyin definitions -->
<script
  type="text/javascript"
  src="{{tpl:BlogThemeURL}}/includes/js/jquery.pinyin.js"
></script>
<!-- Cookie management for the "remember me" functionality -->
<script
  type="text/javascript"
  src="{{tpl:BlogThemeURL}}/includes/js/jquery.cookie.js"
></script>
<!-- Load script to prepare the media players -->
<script
  type="text/javascript"
  src="{{tpl:BlogThemeURL}}/includes/js/jquery.player.js"
></script>
<!-- Load script to prepare the exercices -->
<script
  type="text/javascript"
  src="{{tpl:BlogThemeURL}}/includes/js/jquery.exercices.js"
></script>
<!-- Load script to create pinyin tooltips when hovering "ch" or "chb" tags -->
<script
  type="text/javascript"
  src="{{tpl:BlogThemeURL}}/includes/js/jquery.chinese.js"
></script>
<!-- Load script to lazy load images -->
<script
  type="text/javascript"
  src="{{tpl:BlogThemeURL}}/includes/js/img-lazy-loading.js"
></script>

<!-- Favicon -->
<link
  rel="icon"
  type="image/png"
  href="{{tpl:BlogThemeURL}}/includes/images/logo/orchid-64.png"
/>

<!-- Javascript to execute once the document is ready -->
<script type="text/javascript">
  $(document).ready(function () {
    // Prepare the pinyin that should appear when hovering <ch> or <chb> tags
    preparePinyinOnHover();

    // Transform all the pinyin that is of the form ni3hao3 in "py" and "pyb" markup to accented pinyin
    transformPinyin();

    // Initialize tooltips (Bootstrap 5 JS is vanilla, not a jQuery plugin)
    document
      .querySelectorAll('[data-bs-toggle="tooltip"]')
      .forEach(function (el) {
        new bootstrap.Tooltip(el, {
          delay: { show: 1000, hide: 0 },
        });
      });

    // Transform Chinese in the content but avoid some cases
    $("body *")
      .find(":not(pre):not(code):not(char):not(.blogTitle)")
      .replaceText(/([\u3000-\uFFFF]+)/g, "<span class='zh'>$1</span>");

    // Code for the button allowing the user to go back to top
    var pxShow = 10; //height on which the button will show
    var fadeInTime = 1000; //how slow/fast you want the button to show
    var fadeOutTime = 1000; //how slow/fast you want the button to hide
    var scrollSpeed = 0; //how slow/fast you want the button to scroll to top. can be a value, 'slow', 'normal' or 'fast'
    jQuery(window).scroll(function () {
      if (jQuery(window).scrollTop() >= pxShow) {
        jQuery("#back-to-top").fadeIn(fadeInTime);
      } else {
        jQuery("#back-to-top").fadeOut(fadeOutTime);
      }
    });
    jQuery("#back-to-top a").click(function () {
      jQuery("html, body").animate({ scrollTop: 0 }, scrollSpeed);
      return false;
    });

    // Prepare the audio players
    prepareAudioPlayers();

    // Configure excercices
    configureExercices();

    // Lazy-load the images
    var placeholders = document.querySelectorAll(".defer-image");
    for (var i = 0, len = placeholders.length; i < len; i++) {
      deferImage(placeholders[i]);
    }
  });
</script>
